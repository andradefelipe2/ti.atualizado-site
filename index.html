<form id="form-cotacao" novalidate>
  <div class="form-row">
    <div class="field">
      <label for="name">Nome / Empresa <span class="req">*</span></label>
      <input type="text" id="name" name="nome" placeholder="Seu nome ou empresa" required>
    </div>
    <div class="field">
      <label for="email">E-mail <span class="req">*</span></label>
      <input type="email" id="email" name="email" placeholder="voce@email.com" required>
    </div>
  </div>

  <div class="form-row">
    <div class="field">
      <label for="project">Tipo de projeto <span class="req">*</span></label>
      <select id="project" name="tipo_projeto" required>
        <option value="" disabled selected>Selecione...</option>
        <option value="landing">Landing Page</option>
        <option value="institucional">Site Institucional</option>
        <option value="ecommerce">E-commerce</option>
        <option value="redesign">Redesign de site existente</option>
        <option value="outro">Outro</option>
      </select>
    </div>
    <div class="field">
      <label for="budget">Orçamento previsto <span class="req">*</span></label>
      <select id="budget" name="orcamento" required>
        <option value="" disabled selected>Selecione...</option>
        <option value="ate-2k">Até R$ 2.000</option>
        <option value="2k-5k">R$ 2.000 – R$ 5.000</option>
        <option value="5k-10k">R$ 5.000 – R$ 10.000</option>
        <option value="10k-30k">R$ 10.000 – R$ 30.000</option>
        <option value="30k+">Acima de R$ 30.000</option>
      </select>
    </div>
  </div>

  <div class="form-row">
    <div class="field">
      <label for="timeline">Prazo desejado</label>
      <select id="timeline" name="prazo">
        <option value="" disabled selected>Selecione...</option>
        <option value="urgente">O mais rápido possível</option>
        <option value="1mes">Dentro de 1 mês</option>
        <option value="3meses">Dentro de 3 meses</option>
        <option value="flexivel">Flexível</option>
      </select>
    </div>
    <div class="field">
      <label for="reference">Site de referência (opcional)</label>
      <input type="url" id="reference" name="referencia" placeholder="https://exemplo.com">
    </div>
  </div>

  <div class="field">
    <label for="details">Descreva seu projeto <span class="req">*</span></label>
    <textarea id="details" name="detalhes" placeholder="Conte sobre o objetivo do site, funcionalidades desejadas, público-alvo..." required></textarea>
  </div>

  <button type="submit" class="btn-submit">Enviar Solicitação →</button>
  <p class="form-note">Seus dados são enviados diretamente para nosso e-mail. Sem spam.</p>
</form>
